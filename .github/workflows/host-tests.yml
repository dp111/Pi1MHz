name: "Host tests"

# The host-side suites under src/tests/ build real firmware sources against
# stub headers and run on the PC.  Only two of them ran in CI (wifirom and
# helpers, from beeb-roms.yml), so the services suite stopped linking at
# 368e244 and nobody noticed.  src/tests/run_all.sh runs every suite and
# fails if any does; a suite added under src/tests/ is picked up by it.
# See docs/dev/host-tests.md.
#
# wifirom is left out: it needs beebasm and py65, which beeb-roms.yml
# installs.  helpers runs here as well as there; it takes a second.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: All suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # fujinet builds src/fujinet/cJSON; mtpsession compiles usb/mtp_fs.c
      # against TinyUSB's headers (shallow: only its headers are read).  No
      # suite reads lwip or mbedtls, so they are not fetched.
      - name: cJSON submodule
        run: git submodule update --init src/fujinet/cJSON
      - name: TinyUSB submodule
        run: git submodule update --init --depth 1 src/usb/tinyusb

      - name: Run every suite
        run: sh src/tests/run_all.sh
