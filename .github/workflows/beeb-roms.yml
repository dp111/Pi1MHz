name: "Beeb ROMs"

# The 6502 side is not part of the CMake build, so nothing else would notice
# if the ROM stopped assembling, if its service command numbers drifted from
# the headers it talks to, or if the images committed under firmware/Pi1MHz/
# stopped matching the source they are built from.

on:
  push:
    branches: [master]
    paths:
      - 'beeb/**'
      - '6502code/**'
      - 'firmware/Pi1MHz/6502code.bin'
      - 'firmware/Pi1MHz/1mhz-wicfs.rom'
      - 'src/wifi_service.h'
      - 'src/net_service.h'
      - 'src/tests/wifirom/**'
      # the helper table / help screen step: helpers.c's help template, read
      # through the webserver suite's extract.awk, built with cflags.sh
      - 'src/helpers.c'
      - 'src/tests/helpers/**'
      - 'src/tests/webserver/extract.awk'
      - 'src/tests/cflags.sh'
      - '.github/workflows/beeb-roms.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  roms:
    name: Assemble and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build beebasm
        run: |
          git clone --depth 1 https://github.com/stardot/beebasm.git "$RUNNER_TEMP/beebasm"
          # its Makefile lives in src/ and writes the binary to the root. The
          # default target only prints the platform list; "code" builds it.
          make -C "$RUNNER_TEMP/beebasm/src" code -j"$(nproc)"
          test -x "$RUNNER_TEMP/beebasm/beebasm"
          echo "$RUNNER_TEMP/beebasm" >> "$GITHUB_PATH"

      - name: py65, the 6502 the ROM service checks run on
        run: pip install py65

      - name: ROM interface and assembly
        run: sh src/tests/wifirom/run_tests.sh

      - name: The shipped 6502code.bin matches its source
        working-directory: 6502code
        run: |
          sha_before=$(sha256sum ../firmware/Pi1MHz/6502code.bin | cut -d' ' -f1)
          beebasm -i 6502code.asm
          sha_after=$(sha256sum ../firmware/Pi1MHz/6502code.bin | cut -d' ' -f1)
          echo "committed $sha_before"
          echo "rebuilt   $sha_after"
          test "$sha_before" = "$sha_after" || {
            echo "firmware/Pi1MHz/6502code.bin is not what 6502code/6502code.asm builds:" \
                 "rebuild it and commit the result" >&2
            exit 1
          }

      - name: The shipped 1mhz-wicfs.rom matches its sources
        run: |
          # The filing system half is fetched, not committed, so tell a
          # vanished upstream (exit 2, a warning) apart from a build that
          # fails or a stale image: those are this repository's problem.
          rc=0
          sh beeb/1mhz-wifi/build-merged.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::could not fetch the merged ROM's upstream sources"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          committed=$(sha256sum firmware/Pi1MHz/1mhz-wicfs.rom | cut -d' ' -f1)
          rebuilt=$(sha256sum beeb/1mhz-wifi/src/1mhz-wicfs.rom | cut -d' ' -f1)
          echo "committed $committed"
          echo "rebuilt   $rebuilt"
          test "$committed" = "$rebuilt" || {
            echo "firmware/Pi1MHz/1mhz-wicfs.rom is not what build-merged.sh builds:" \
                 "rebuild it and commit the result" >&2
            exit 1
          }

      - name: Helper table and help screen
        run: sh src/tests/helpers/run_tests.sh
